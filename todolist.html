<!DOCTYPE html>
<html>
<head>
<title>To-Do List</title>

<style>
    body{
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background:linear-gradient(135deg, #667eea, #764ba2, #6dd5fa);
    }

    input{
             width: 320px;          
              padding: 12px;         
              border: 1px solid #ccc;
              border-radius: 10px;   
              font-size: 16px;
              align-self: center;
    }

    button{
        padding: 10px;
        cursor: pointer;
        border-radius: 10px;
        width: 100px;
        height: 80;
        border-color: #0a070e;
        font-size: 20px;
         background-color: #2dc62a;
          color: white;
          border: none;
   
        
    }

    li{
    list-style:none;
    background:#f7f7f7;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

h1{
color: #f8f8f8;
font-size: 50;
font-family: 'Times New Roman', Times, serif;

}
.delete1
{
        padding: 10px;
        cursor: pointer;
        border-radius: 10px;
        width: 100px;
        height: 80;
        border-color: #0a070e;
        font-size: 20px;
         background-color: #ef0c0c;
          color: white;
          border: none;  
}
</style>
</head>

<body>

<h1>To-Do List</h1>


<input type="text" id="task" placeholder="Enter a task">
<br><br>
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<script>
function addTask()
{
    let task = document.getElementById("task").value;

    if(task === "")
    {
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");
    li.innerHTML = task + " <button class='delete1' onclick='removeTask(this)'>Delete</button>";

    document.getElementById("taskList").appendChild(li);

    document.getElementById("task").value = "";
}

function removeTask(button)
{
    button.parentElement.remove();
}
</script>

</body>
</html>
